<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
               background: transparent; overflow: hidden; user-select: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #bubble { position: absolute; left: 50%; top: 8%; transform: translateX(-50%);
            max-width: 80%; padding: 8px 14px; border-radius: 14px;
            background: #FFFDF6; border: 2px solid #39406B; color: #2A2438;
            font: 13px/1.5 "Microsoft YaHei", sans-serif; display: none; }
  #bubble.on { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bubble"></div>
<script src="../node_modules/l2d/dist/index.min.js"></script>
<script src="./pet.js"></script>
</body>
</html>
